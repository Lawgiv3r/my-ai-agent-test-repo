<aside [class.collapsed]="isCollapsed" class="sidebar" [ngClass]="isCollapsed ? 'collapsed' : 'expanded'">
  <div class="sidebar-header">
    <h2 class="sidebar-title" [ngClass]="isCollapsed ? 'hidden' : 'visible'">Menu</h2>
    <button (click)="toggleSidebar()" class="sidebar-toggle-btn" [ngClass]="isCollapsed ? 'collapsed' : 'expanded'">
      <svg xmlns="http://www.w3.org/2000/svg" class="sidebar-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h18"></path>
        <path d="M3 6h18"></path>
        <path d="M3 18h18"></path>
      </svg>
    </button>
  </div>
  
  <nav class="sidebar-nav">
    <ul class="sidebar-nav-list">
      <li class="sidebar-nav-item" *ngFor="let item of menuItems">
        <a [routerLink]="item.link" class="sidebar-nav-link" [ngClass]="isCollapsed ? 'collapsed' : 'expanded'">
          <span class="sidebar-nav-icon" [ngClass]="isCollapsed ? 'collapsed' : 'expanded'">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path [attr.d]="item.icon"></path>
            </svg>
          </span>
          <span class="sidebar-nav-text" [ngClass]="isCollapsed ? 'hidden' : 'visible'">{{ item.title }}</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
